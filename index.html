<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor Ágil de Tareas - CRUD con IA</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Gestor de Tareas Ágiles</h1>
            <p>Proyecto CRUD desarrollado mediante Ingeniería de Prompts</p>
        </header>

        <!-- Formulario Create / Update -->
        <section class="form-section">
            <h2 id="form-title">Nueva Tarea</h2>
            <form id="task-form">
                <input type="hidden" id="task-id">
                <div class="form-group">
                    <label for="title">Título de la tarea *</label>
                    <input type="text" id="title" placeholder="Ej. Configurar repositorio GitHub" required>
                </div>
                <div class="form-group">
                    <label for="assignee">Responsable *</label>
                    <input type="text" id="assignee" placeholder="Ej. Ana Gómez" required>
                </div>
                <div class="form-group">
                    <label for="status">Estado</label>
                    <select id="status">
                        <option value="Pendiente">Pendiente</option>
                        <option value="En Progreso">En Progreso</option>
                        <option value="Completado">Completado</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" id="submit-btn" class="btn btn-primary">Guardar Tarea</button>
                    <button type="button" id="cancel-btn" class="btn btn-secondary hidden">Cancelar</button>
                </div>
            </form>
        </section>

        <!-- Buscador y Tabla Read / Delete -->
        <section class="list-section">
            <div class="list-header">
                <h2>Listado de Tareas</h2>
                <input type="text" id="search-input" placeholder="Buscar por título o responsable...">
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Responsable</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="task-list">
                    <!-- Los registros se insertan dinámicamente con JS -->
                </tbody>
            </table>
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>
